name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: check formatting
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: doc
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: test
        # ninterp crate has few enough features that this isn't too hefty
        run: cargo hack test --feature-powerset --verbose

      - name: test ninterp-uom
        # Powerset over autoconvert/serde/std only; f64 pinned as the required storage
        # type, other ~21 storage-type alternatives excluded (uom passthrough, not this crate's logic).
        run: cargo hack test -p ninterp-uom --feature-powerset --features f64 --exclude-features f32,usize,u8,u16,u32,u64,u128,isize,i8,i16,i32,i64,i128,bigint,biguint,rational,rational32,rational64,bigrational,complex32,complex64 --verbose

      - name: install no_std target
        run: rustup target add thumbv7m-none-eabi

      - name: verify no_std build (bare-metal target)
        run: cargo build --lib --no-default-features --target thumbv7m-none-eabi

      - name: verify no_std build (bare-metal target, all features)
        run: cargo build --lib --no-default-features --features serde --target thumbv7m-none-eabi

      - name: run all examples
        run: |
          for name in $(cargo metadata --no-deps --format-version 1 | \
            python3 -c "import sys,json; [print(t['name']) for p in json.load(sys.stdin)['packages'] for t in p['targets'] if 'example' in t['kind']]"); do
            cargo run --example "$name"
          done

      - name: compile benchmarks
        run: cargo bench --no-run
