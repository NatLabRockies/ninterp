name: release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  release:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: check semver
        uses: obi1kenobi/cargo-semver-checks-action@v2

      - run: cargo publish --dry-run

      - name: build release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"

          # CHANGELOG.md entry for this version (e.g. "## [0.11.2]" for tag "v0.11.2"),
          # stops at the next "## [" header.
          notes_file="${RUNNER_TEMP}/release_notes.md"
          echo "RELEASE_NOTES_FILE=${notes_file}" >> "${GITHUB_ENV}"

          sed -n "/## \[${version}\]/,/## \[/p" CHANGELOG.md | sed '$d' > "${notes_file}"
          if [ ! -s "${notes_file}" ]; then
            echo "Release notes for ${GITHUB_REF_NAME}" > "${notes_file}"
          fi

          # GitHub's auto-generated notes (PRs/commits/contributors since the last tag).
          echo "" >> "${notes_file}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq .body >> "${notes_file}"

      - name: draft GitHub release
        id: draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --title "${{ github.ref_name }}" \
            --notes-file "${RELEASE_NOTES_FILE}" \
            --draft

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: delete draft on failed publish
        if: failure() && steps.draft.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete ${{ github.ref_name }} --repo ${{ github.repository }} --yes

      - name: publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --repo ${{ github.repository }} --draft=false
