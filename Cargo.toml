[workspace]
members = ["ninterp-uom"]

[workspace.dependencies]
ninterp = { path = ".", version = "0.11.0" }
num-traits = { version = "0.2.15", default-features = false, features = [
    "libm",
] }

[package]
name = "ninterp"
version = "0.11.1"
edition = "2021"
# 1.81 for core::error::Error, needed by thiserror's derive under no_std.
rust-version = "1.81"
description = "Numerical interpolation for N-dimensional rectilinear grids"
repository = "https://github.com/NatLabRockies/ninterp"
license = "BSD-3-Clause"
keywords = [
    "interpolation",
    "multidimensional",
    "multilinear",
    "numerical",
    "linear",
]
categories = ["mathematics"]

[dependencies]
dyn-clone = "1"
ndarray = { version = "0.17", default-features = false }
num-traits = { workspace = true, version = "0.2.15" }
serde = { version = "1.0.103", optional = true, default-features = false, features = [
    "derive",
    "alloc",
] }
serde_unit_struct = { version = "0.1.3", optional = true }
serde-ndim = { version = "2.2.1", optional = true, default-features = false, features = [
    "ndarray",
] }
thiserror = { version = "2.0.12", default-features = false }

[dev-dependencies]
criterion = "0.5.1"
ndarray-rand = "0.16.0"
approx = "0.5.1"
uom = "0.36.0"
serde_json = "1.0.140"
bincode = "1.3"

[[bench]]
name = "benchmark"
harness = false

[features]
default = ["std"]
std = [
    "ndarray/std",
    "num-traits/std",
    "thiserror/std",
    "serde?/std",
    "serde-ndim?/std",
]
serde = [
    "dep:serde",
    "ndarray/serde",
    "dep:serde_unit_struct",
    "dep:serde-ndim",
]
